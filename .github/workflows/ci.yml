name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verificar-secretos.sh
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: uniapp, POSTGRES_PASSWORD: ci-test, POSTGRES_DB: uniapp_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uniapp" --health-interval 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://uniapp:ci-test@localhost:5432/uniapp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: cd backend && test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm install && npm test && npm run build
