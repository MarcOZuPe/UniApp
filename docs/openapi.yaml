openapi: 3.0.3
info:
  title: UniApp · API completa
  version: 0.4.0
  description: Contrato de cuentas, sesión, vinculación y autorización de nuevas reservas. Los demás flujos lo consumen vía API (nunca por tablas).
servers: [{ url: / }]
tags:
  - { name: A-acceso, description: "Flujo A · Víctor · implementado en I01 e I06" }
  - { name: B-tutor, description: "Flujo B · expediente y revisión mínima (I02)" }
  - { name: B-catalogo, description: "Flujo B · catálogo de cursos y perfil público (I07)" }
  - { name: C-oferta, description: "Flujo C · Mateo · esqueleto (I03)" }
  - { name: D-reserva, description: "Flujo D · Jhon · reserva transaccional y adjuntos (I04, I09), documentado con ejemplos y errores" }
  - { name: E-sesion, description: "Flujo E · Marco · esqueleto (I05)" }
components:
  securitySchemes:
    sesion: { type: apiKey, in: cookie, name: uniapp_sesion }
  examples:
    SaludReservaEjemplo:
      summary: Estado del flujo
      value: { flujo: reserva, estado: implementado }
    SlotsEjemplo:
      summary: Dos horarios, uno disponible y otro fuera del horizonte
      value:
        slots:
          - id: slot-i04-cercano
            tutor_id: de749037-15ef-4e69-8bfd-826fe844a476
            tutor_nombre: Tutor de prueba
            curso: Álgebra
            inicio: "2026-10-30T14:00:00Z"
            fin: "2026-10-30T15:00:00Z"
            inicio_lima: "2026-10-30 09:00"
            fin_lima: "2026-10-30 10:00"
            disponible: true
            motivo: ""
          - id: slot-i04-lejano
            tutor_id: de749037-15ef-4e69-8bfd-826fe844a476
            tutor_nombre: Tutor de prueba
            curso: Geometría
            inicio: "2026-11-28T20:00:00Z"
            fin: "2026-11-28T21:00:00Z"
            inicio_lima: "2026-11-28 15:00"
            fin_lima: "2026-11-28 16:00"
            disponible: false
            motivo: fuera del horizonte de 28 días
    ReservaEntradaEjemplo:
      summary: Reserva de Álgebra a más de 48 horas
      value:
        slot_id: slot-i04-cercano
        tema: "Álgebra: ecuaciones lineales de primer grado"
        objetivo: "Resolver diez ejercicios de ecuaciones lineales y verificar cada resultado"
        grado: "2° de secundaria"
    ReservaCreadaEjemplo:
      summary: Reserva confirmada con identificador propio
      value:
        id: 6f1c2a9e-3b7d-4c1a-9f2e-8d4b5a6c7e8f
        slot_id: slot-i04-cercano
        tutor_id: de749037-15ef-4e69-8bfd-826fe844a476
        tutor_nombre: Tutor de prueba
        curso: Álgebra
        grado: "2° de secundaria"
        tema: "Álgebra: ecuaciones lineales de primer grado"
        objetivo: "Resolver diez ejercicios de ecuaciones lineales y verificar cada resultado"
        estado: confirmada
        inicio: "2026-10-30T14:00:00Z"
        fin: "2026-10-30T15:00:00Z"
        inicio_lima: "2026-10-30 09:00"
        fin_lima: "2026-10-30 10:00"
        creada_en: "2026-10-29T12:00:00Z"
        adjuntos: []
    AdjuntosEjemplo:
      summary: Un adjunto validado y otro en cuarentena
      value:
        adjuntos:
          - id: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
            nombre: guia-ejercicios.pdf
            tipo: application/pdf
            tamano_bytes: 128000
            estado: validado
            motivo: ""
            descargable: true
            creado_en: "2026-10-29 11:58"
          - id: 2c3d4e5f-6071-4b8c-9d0e-1f2a3b4c5d6e
            nombre: foto-cuaderno.jpg
            tipo: image/jpeg
            tamano_bytes: 84000
            estado: en_cuarentena
            motivo: el análisis de adjuntos no está disponible
            descargable: false
            creado_en: "2026-10-29 11:59"
    AdjuntoCreadoEjemplo:
      summary: Adjunto recibido y en cuarentena
      value:
        id: 2c3d4e5f-6071-4b8c-9d0e-1f2a3b4c5d6e
        nombre: foto-cuaderno.jpg
        tipo: image/jpeg
        tamano_bytes: 84000
        estado: en_cuarentena
        motivo: el análisis de adjuntos no está disponible
        descargable: false
        creado_en: "2026-10-29 11:59"
    ErrorSolicitudInvalida:
      summary: Cuerpo ausente o mal formado
      value: { codigo: solicitud_invalida, mensaje: "El cuerpo de la solicitud no es válido." }
    ErrorNoAutenticado:
      summary: Sin cookie de sesión
      value: { codigo: no_autenticado, mensaje: "Debes iniciar sesión." }
    ErrorSinAutorizacion:
      summary: El menor no tiene autorización vigente
      value: { codigo: sin_autorizacion, mensaje: "No hay una autorización vigente del apoderado." }
    ErrorNoAutorizado:
      summary: La reserva es de otra cuenta
      value: { codigo: no_autorizado, mensaje: "No puedes acceder a esta reserva." }
    ErrorSoloEscolar:
      summary: Rol distinto de escolar
      value: { codigo: solo_escolar, mensaje: "Solo el escolar dueño de la reserva sube adjuntos." }
    ErrorSlotInexistente:
      summary: El horario no existe
      value: { codigo: slot_inexistente, mensaje: "El horario solicitado no existe." }
    ErrorReservaInexistente:
      summary: La reserva no existe
      value: { codigo: reserva_inexistente, mensaje: "La reserva no existe." }
    ErrorAdjuntoInexistente:
      summary: El adjunto no existe en esa reserva
      value: { codigo: adjunto_inexistente, mensaje: "El adjunto no existe." }
    ErrorSlotOcupado:
      summary: Otra reserva ganó el horario
      value:
        codigo: slot_ocupado
        mensaje: "El horario ya fue reservado."
        campos: { slot_id: "El horario ya fue reservado." }
    ErrorAnticipacion:
      summary: Menos de 48 horas de anticipación
      value:
        codigo: anticipacion_insuficiente
        mensaje: "La reserva requiere al menos 48 horas de anticipación."
        campos: { slot_id: "La reserva requiere al menos 48 horas de anticipación." }
    ErrorAdjuntosLlenos:
      summary: La reserva ya tiene cinco adjuntos
      value: { codigo: adjuntos_llenos, mensaje: "La reserva ya tiene el máximo de cinco adjuntos." }
    ErrorAdjuntoGrande:
      summary: El archivo supera 10 MB
      value: { codigo: adjunto_muy_grande, mensaje: "Cada adjunto debe pesar como máximo 10 MB." }
    ErrorAdjuntoInvalido:
      summary: Tipo no permitido
      value: { codigo: adjunto_invalido, mensaje: "El archivo no cumple el formato permitido (PDF, PNG, JPG, TXT o DOCX de hasta 10 MB)." }
    ErrorAdjuntoCuarentena:
      summary: El adjunto todavía no se puede descargar
      value: { codigo: adjunto_en_cuarentena, mensaje: "El adjunto sigue en cuarentena." }
  schemas:
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        nombre_uso: { type: string }
        rol: { type: string, enum: [escolar, apoderado, tutor, coordinador] }
        correo_confirmado: { type: boolean, description: "false hasta que se usa el enlace de confirmación" }
    UsuarioResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        nombre_uso: { type: string }
        rol: { type: string, enum: [escolar, apoderado] }
    Vinculacion:
      type: object
      description: Relación entre un apoderado y un escolar. Una vez aceptada es inmutable.
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [pendiente, aceptada] }
        apoderado: { $ref: '#/components/schemas/UsuarioResumen' }
        escolar: { $ref: '#/components/schemas/UsuarioResumen' }
        autorizacion: { $ref: '#/components/schemas/Autorizacion' }
        creada_en: { type: string, format: date-time }
        aceptada_en: { type: string, format: date-time, nullable: true }
        expira_en: { type: string, format: date-time, description: "Vigencia del enlace de aceptación (24 h)" }
    Autorizacion:
      type: object
      description: Registro de un cambio de permiso del apoderado para crear nuevas reservas.
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [autorizado, no_autorizado] }
        autorizado: { type: boolean }
        creada_en: { type: string, format: date-time, description: "Fecha y hora del cambio" }
    Error:
      type: object
      properties:
        codigo: { type: string }
        mensaje: { type: string }
        campos: { type: object, additionalProperties: { type: string } }
    SlotReserva:
      type: object
      description: Horario publicado por el flujo C. En I04 proviene de una oferta sintética.
      properties:
        id: { type: string }
        tutor_id: { type: string }
        tutor_nombre: { type: string }
        curso: { type: string }
        inicio: { type: string, format: date-time, description: UTC }
        fin: { type: string, format: date-time, description: UTC }
        inicio_lima: { type: string, description: "America/Lima, por ejemplo 2026-10-22 15:00" }
        fin_lima: { type: string }
        disponible: { type: boolean, description: "falso si no cumple 48 h, horizonte o cupo" }
        motivo: { type: string, description: por qué no está disponible }
    AdjuntoReserva:
      type: object
      description: Metadatos del adjunto. El contenido vive en un almacén privado y no se expone.
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string }
        tamano_bytes: { type: integer, format: int64 }
        estado: { type: string, enum: [en_cuarentena, validado, rechazado] }
        motivo: { type: string, description: por qué está en cuarentena o fue rechazado }
        descargable: { type: boolean }
        creado_en: { type: string, description: "hora de Lima" }
    ReservaEntrada:
      type: object
      required: [slot_id, tema, objetivo, grado]
      properties:
        slot_id: { type: string }
        tema: { type: string, minLength: 10, maxLength: 200 }
        objetivo: { type: string, minLength: 20, maxLength: 1000 }
        grado: { type: string, maxLength: 80 }
    ReservaD:
      type: object
      description: Reserva confirmada de inmediato (D05, RN-06).
      properties:
        id: { type: string, format: uuid }
        slot_id: { type: string }
        tutor_id: { type: string }
        tutor_nombre: { type: string }
        curso: { type: string }
        grado: { type: string }
        tema: { type: string }
        objetivo: { type: string }
        estado: { type: string, enum: [confirmada] }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        inicio_lima: { type: string }
        fin_lima: { type: string }
        creada_en: { type: string, format: date-time }
        adjuntos:
          type: array
          items: { $ref: '#/components/schemas/AdjuntoReserva' }
    SesionI05:
      type: object
      required: [id, reserva_id, tutor_id, escolar_id, inicio, fin, asistencias]
      properties:
        id: { type: string }
        reserva_id: { type: string }
        tutor_id: { type: string }
        escolar_id: { type: string }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        asistencias:
          type: array
          items:
            $ref: '#/components/schemas/AsistenciaI05'
    AsistenciaI05:
      type: object
      required: [usuario_id, rol, declarada_en]
      properties:
        usuario_id: { type: string }
        rol: { type: string, enum: [tutor, escolar] }
        declarada_en: { type: string, format: date-time }
    DocumentoTutor:
      type: object
      required: [id, nombre, tipo, tamano_bytes]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string, enum: [application/pdf] }
        tamano_bytes: { type: integer, maximum: 10485760 }
        creado_en: { type: string, format: date-time }
    ExpedienteTutor:
      type: object
      required: [tutor_id, presentacion, cursos, experiencia, estado, presentado_en, documentos]
      properties:
        tutor_id: { type: string, format: uuid }
        presentacion: { type: string, maxLength: 500 }
        cursos: { type: string, maxLength: 500 }
        experiencia: { type: string, maxLength: 2000 }
        estado: { type: string, enum: [pendiente, aprobado, rechazado] }
        presentado_en: { type: string, format: date-time }
        vence_en: { type: string, format: date-time }
        motivo_rechazo: { type: string }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/DocumentoTutor' }
    PerfilPublicoTutor:
      type: object
      description: Lista permitida de campos públicos; solo existe mientras el expediente I02 esté aprobado y vigente.
      required: [tutor_id, presentacion, cursos, experiencia]
      properties:
        tutor_id: { type: string, format: uuid }
        presentacion: { type: string }
        cursos: { type: string }
        experiencia: { type: string }
    CursoCatalogo:
      type: object
      required: [id, nombre, grado, estado]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        grado: { type: string }
        estado: { type: string, enum: [pendiente, aprobado, rechazado] }
        motivo_rechazo: { type: string }
    ColegioCatalogo:
      type: object
      required: [nombre, distrito]
      properties:
        nombre: { type: string }
        distrito: { type: string }
    ImportacionCatalogo:
      type: object
      required: [id, fuente, importado_en, cursos, colegios]
      properties:
        id: { type: integer, format: int64 }
        fuente: { type: string, description: "Incluye etiqueta explícita cuando los datos son sintéticos." }
        importado_en: { type: string, format: date-time, description: "Fecha UTC asignada por el servidor." }
        cursos:
          type: array
          items: { $ref: '#/components/schemas/CursoCatalogo' }
        colegios:
          type: array
          items: { $ref: '#/components/schemas/ColegioCatalogo' }
    SolicitudColegio:
      type: object
      required: [id, nombre, distrito, solicitado_en]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        distrito: { type: string }
        solicitado_en: { type: string, format: date-time }
paths:
  /api/auth/registro:
    post:
      summary: Registro público (escolar, apoderado, tutor). Coordinación no se autoasigna.
      description: La cuenta nace sin confirmar y se envía un enlace de un solo uso (30 min) al correo. Si no se confirma en ese plazo, la cuenta se borra y el correo queda libre. Un correo admite un solo registro.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, nombre_uso, clave, rol], properties: { email: {type: string}, nombre_uso: {type: string}, clave: {type: string}, rol: {type: string, enum: [escolar, apoderado, tutor]} } } } }
      responses:
        '201': { description: Creado sin confirmar; se envió un enlace al correo, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '400': { description: Solicitud inválida }
        '403': { description: Rol no permitido }
        '409': { description: "Correo en uso (un correo, un registro)" }
        '422': { description: Validación por campo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/ingreso:
    post:
      summary: Abre sesión (cookie HttpOnly, SameSite=Strict, 12 h)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, clave], properties: { email: { type: string, format: email }, clave: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '401': { description: Credenciales incorrectas (mensaje genérico; también cubre cuentas sin confirmar) }
        '429': { description: 5 fallos seguidos; bloqueo de 15 min }
  /api/auth/salida:
    post: { security: [{ sesion: [] }], summary: Cierra sesión, responses: { '204': { description: OK }, '401': { description: Sin sesión } } }
  /api/auth/yo:
    get: { security: [{ sesion: [] }], summary: Usuario de la sesión, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }, '401': { description: Sin sesión } } }
  /api/auth/recuperar:
    post:
      summary: Solicita enlace (respuesta idéntica exista o no el correo)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses: { '202': { description: Aceptado } }
  /api/auth/restablecer:
    post:
      summary: Cambia la clave con token de un solo uso (vence en 1 h) y cierra todas las sesiones
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, clave], properties: { token: { type: string }, clave: { type: string } } } } }
      responses: { '200': { description: OK }, '400': { description: Token inválido o vencido }, '422': { description: Clave no cumple la política del rol } }
  /api/auth/confirmar:
    post:
      summary: Confirma el correo con el token del enlace (un solo uso, vence en 30 min)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses: { '200': { description: Correo confirmado }, '400': { description: "Token inválido, vencido o ya usado" } }
  /api/auth/reenviar-confirmacion:
    post:
      summary: Reenvía el enlace (renueva 30 min; respuesta idéntica exista o no el correo, para no revelar registros)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses: { '202': { description: Aceptado } }
  /api/apoderado/vinculaciones:
    post:
      tags: [A-acceso]
      summary: Solicita vincular a un escolar (solo apoderado)
      description: >
        El apoderado ingresa el correo de un escolar activo y confirmado. Se envía
        un enlace de un solo uso al correo del escolar, válido por 24 horas. Un
        apoderado puede tener varios escolares; un escolar solo puede tener un
        apoderado aceptado.
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email_escolar], properties: { email_escolar: { type: string, format: email } } } } }
      responses:
        '202': { description: Solicitud creada y enlace enviado, content: { application/json: { schema: { type: object, properties: { mensaje: { type: string }, vinculacion: { $ref: '#/components/schemas/Vinculacion' } } } } } }
        '401': { description: Sin sesión }
        '403': { description: El usuario no es apoderado }
        '404': { description: No existe un escolar con ese correo }
        '409': { description: El escolar ya tiene apoderado o una solicitud pendiente }
        '422': { description: Datos inválidos o el destino no es un escolar activo y confirmado }
    get:
      tags: [A-acceso]
      summary: Lista los escolares de un apoderado
      security: [{ sesion: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { vinculaciones: { type: array, items: { $ref: '#/components/schemas/Vinculacion' } } } } } } }
        '401': { description: Sin sesión }
        '403': { description: El usuario no es apoderado }
  /api/apoderado/escolares/{escolarID}/autorizacion:
    post:
      tags: [A-acceso]
      summary: Autoriza o revoca la creación de nuevas reservas (solo apoderado)
      description: >
        Registra un cambio de estado con fecha y hora. El estado vigente es el
        último registrado. No modifica reservas ya confirmadas: solo se comprueba
        al intentar crear una reserva nueva. El escolar debe ser el vinculado al
        apoderado autenticado.
      security: [{ sesion: [] }]
      parameters:
        - { name: escolarID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autorizado]
              properties:
                autorizado: { type: boolean }
      responses:
        '200': { description: Estado actualizado, content: { application/json: { schema: { type: object, properties: { mensaje: { type: string }, autorizacion: { $ref: '#/components/schemas/Autorizacion' } } } } } }
        '401': { description: Sin sesión }
        '403': { description: El usuario no es apoderado o no es el apoderado del escolar }
        '409': { description: El escolar no tiene un apoderado vinculado }
        '422': { description: Falta el campo autorizado }
  /api/apoderado/escolares/{escolarID}/autorizaciones:
    get:
      tags: [A-acceso]
      summary: Consulta el historial de autorizaciones de un escolar (solo apoderado)
      description: >
        Devuelve cada vez que se otorgó o retiró el permiso para crear nuevas
        reservas, del cambio más reciente al más antiguo. Incluye la autorización
        inicial registrada al aceptar la vinculación. El escolar debe pertenecer
        al apoderado autenticado.
      security: [{ sesion: [] }]
      parameters:
        - { name: escolarID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "Historial de cambios, del más reciente al más antiguo", content: { application/json: { schema: { type: object, properties: { autorizaciones: { type: array, items: { $ref: '#/components/schemas/Autorizacion' } } } } } } }
        '401': { description: Sin sesión }
        '403': { description: El usuario no es apoderado o no es el apoderado del escolar }
        '409': { description: El escolar no tiene un apoderado vinculado }
  /api/escolar/vinculaciones/consultar:
    post:
      tags: [A-acceso]
      summary: Consulta una solicitud pendiente sin aceptarla
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { vinculacion: { $ref: '#/components/schemas/Vinculacion' } } } } } }
        '400': { description: Enlace inválido o vencido }
        '401': { description: Sin sesión }
        '403': { description: El usuario no es escolar }
  /api/escolar/vinculaciones/aceptar:
    post:
      tags: [A-acceso]
      summary: Acepta la vinculación con el token del enlace (un solo uso, 24 h)
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        '200': { description: Vinculación aceptada; la relación no se puede desvincular, content: { application/json: { schema: { type: object, properties: { mensaje: { type: string }, vinculacion: { $ref: '#/components/schemas/Vinculacion' } } } } } }
        '400': { description: "Enlace inválido, vencido o ya usado" }
        '401': { description: Sin sesión }
        '403': { description: El usuario no es escolar }
        '409': { description: El escolar ya tiene un apoderado aceptado }
  /api/escolar/apoderado:
    get:
      tags: [A-acceso]
      summary: Consulta el apoderado aceptado del escolar
      security: [{ sesion: [] }]
      responses:
        '200': { description: OK; vinculacion es null si no hay apoderado, content: { application/json: { schema: { type: object, properties: { vinculacion: { allOf: [{ $ref: '#/components/schemas/Vinculacion' }], nullable: true } } } } } }
        '401': { description: Sin sesión }
        '403': { description: El usuario no es escolar }
  /api/coordinacion/panel:
    get:
      security: [{ sesion: [] }]
      summary: Zona de coordinación (permiso coordinacion:acceder)
      responses: { '200': { description: OK }, '401': { description: Sin sesión }, '403': { description: Rol sin permiso (p. ej. escolar) } }
  /api/tutor/salud:
    get: { tags: [B-tutor], summary: Estado del flujo B, responses: { '200': { description: OK } } }
  /api/tutor/mi-expediente:
    get:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Consultar el expediente propio (solo tutor)
      responses:
        '200': { description: Expediente propio, content: { application/json: { schema: { $ref: '#/components/schemas/ExpedienteTutor' } } } }
        '401': { description: Sin sesión }
        '403': { description: La cuenta no puede presentar expedientes }
        '404': { description: Aún no existe un expediente }
  /api/tutor/expediente:
    post:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Presentar o volver a presentar un expediente de tutor
      description: El perfil permanece privado hasta ser aprobado. Acepta de 1 a 5 PDF, máximo 10 MiB por archivo. Los archivos se guardan fuera del contenido público y se descargan con autorización.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [presentacion, cursos, experiencia, documentos]
              properties:
                presentacion: { type: string, maxLength: 500 }
                cursos: { type: string, maxLength: 500 }
                experiencia: { type: string, maxLength: 2000 }
                documentos:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        '201': { description: Expediente enviado a revisión, content: { application/json: { schema: { $ref: '#/components/schemas/ExpedienteTutor' } } } }
        '401': { description: Sin sesión }
        '403': { description: La cuenta no puede presentar expedientes }
        '422': { description: Campos inválidos o PDF no válido }
  /api/tutor/revision:
    get:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Listar expedientes pendientes (solo coordinación)
      responses:
        '200': { description: Expedientes pendientes }
        '401': { description: Sin sesión }
        '403': { description: Sin permiso de coordinación }
  /api/tutor/{id}/revision:
    post:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Aprobar o rechazar un expediente pendiente (solo coordinación)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [estado, vence_en]
                  properties:
                    estado: { type: string, enum: [aprobado] }
                    vence_en: { type: string, format: date-time }
                - type: object
                  required: [estado, motivo_rechazo]
                  properties:
                    estado: { type: string, enum: [rechazado] }
                    motivo_rechazo: { type: string }
      responses:
        '200': { description: Revisión guardada }
        '401': { description: Sin sesión }
        '403': { description: Sin permiso de coordinación }
        '404': { description: Expediente inexistente }
        '409': { description: Expediente ya revisado }
        '422': { description: Fecha o motivo inválidos }
  /api/tutor/documentos/{id}:
    get:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Descargar un documento privado (propietario o coordinación)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: PDF privado, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '401': { description: Sin sesión }
        '403': { description: Sin permiso }
        '404': { description: Documento inexistente }
  /api/tutor/perfiles/{id}:
    get:
      tags: [B-tutor]
      summary: Consultar perfil aprobado y vigente (no incluye documentos)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Perfil público
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilPublicoTutor' }
        '404': { description: "Perfil no aprobado, vencido o inexistente" }
  /api/tutor/perfiles:
    get:
      tags: [B-tutor]
      summary: Listar perfiles aprobados y vigentes con campos públicos (I07)
      responses:
        '200':
          description: Directorio público; no incluye documentos, constancias, vencimientos ni contactos
          content:
            application/json:
              schema:
                type: object
                required: [perfiles]
                properties:
                  perfiles:
                    type: array
                    items: { $ref: '#/components/schemas/PerfilPublicoTutor' }
  /api/catalogo:
    get:
      tags: [B-catalogo]
      summary: Consultar la última importación de cursos aprobados y padrón escolar
      responses:
        '200':
          description: Fuente y fecha de importación; los cursos pendientes/rechazados no son públicos
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportacionCatalogo' } } }
        '404': { description: Catálogo sin importaciones }
  /api/catalogo/importaciones:
    post:
      tags: [B-catalogo]
      security: [{ sesion: [] }]
      summary: Importar cursos y padrón escolar sin integrar fuentes externas
      description: Coordinación registra fuente y fecha del servidor. Los cursos quedan pendientes de aprobación. Los datos sintéticos deben identificarse en fuente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fuente, cursos, colegios]
              properties:
                fuente: { type: string, minLength: 1, maxLength: 120 }
                cursos:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [nombre, grado]
                    properties:
                      nombre: { type: string, maxLength: 120 }
                      grado: { type: string, maxLength: 80 }
                colegios:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [nombre, distrito]
                    properties:
                      nombre: { type: string, maxLength: 160 }
                      distrito: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Importación registrada, con los cursos en estado pendiente
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportacionCatalogo' } } }
        '401': { description: Sin sesión }
        '403': { description: Se requiere el permiso catalogo:gestionar }
        '422': { description: "Fuente, filas o duplicados inválidos" }
  /api/catalogo/cursos/pendientes:
    get:
      tags: [B-catalogo]
      security: [{ sesion: [] }]
      summary: Listar cursos de la importación actual pendientes de aprobación
      responses:
        '200':
          description: Cursos pendientes agrupables por grado
          content:
            application/json:
              schema:
                type: object
                required: [cursos]
                properties:
                  cursos:
                    type: array
                    items: { $ref: '#/components/schemas/CursoCatalogo' }
        '401': { description: Sin sesión }
        '403': { description: Se requiere el permiso catalogo:gestionar }
  /api/catalogo/cursos/{id}/revision:
    post:
      tags: [B-catalogo]
      security: [{ sesion: [] }]
      summary: Aprobar o rechazar un curso del grado importado
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [aprobado, rechazado] }
                motivo_rechazo: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Curso revisado
          content: { application/json: { schema: { $ref: '#/components/schemas/CursoCatalogo' } } }
        '401': { description: Sin sesión }
        '403': { description: Se requiere el permiso catalogo:gestionar }
        '404': { description: Curso fuera de la importación actual o inexistente }
        '409': { description: El curso ya fue revisado }
        '422': { description: Motivo requerido al rechazar }
  /api/catalogo/colegios/solicitudes:
    post:
      tags: [B-catalogo]
      security: [{ sesion: [] }]
      summary: Solicitar la incorporación de un colegio faltante
      description: Solo escolares y apoderados. La solicitud queda en UniApp para revisión; no llama a servicios externos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, distrito]
              properties:
                nombre: { type: string, maxLength: 160 }
                distrito: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Solicitud registrada
          content: { application/json: { schema: { $ref: '#/components/schemas/SolicitudColegio' } } }
        '401': { description: Sin sesión }
        '403': { description: Solo escolares y apoderados pueden solicitar }
        '409': { description: Colegio ya importado o solicitud duplicada pendiente }
        '422': { description: Nombre o distrito inválidos }
    get:
      tags: [B-catalogo]
      security: [{ sesion: [] }]
      summary: Listar solicitudes pendientes sin exponer la identidad del solicitante
      responses:
        '200':
          description: Solicitudes pendientes
          content:
            application/json:
              schema:
                type: object
                required: [solicitudes]
                properties:
                  solicitudes:
                    type: array
                    items: { $ref: '#/components/schemas/SolicitudColegio' }
        '401': { description: Sin sesión }
        '403': { description: Se requiere el permiso catalogo:gestionar }
  /api/oferta/salud:
    get: { tags: [C-oferta], summary: Estado del flujo C, responses: { '200': { description: OK } } }
  /api/reserva/salud:
    get:
      tags: [D-reserva]
      summary: Estado del flujo de reserva
      description: Endpoint público de salud; no exige sesión.
      responses:
        '200':
          description: El flujo responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  flujo: { type: string, example: reserva }
                  estado: { type: string, example: implementado }
              examples:
                ok: { $ref: '#/components/examples/SaludReservaEjemplo' }
  /api/reserva/slots:
    get:
      tags: [D-reserva]
      summary: Oferta disponible para reservar (I04; sintética hasta I08)
      description: >
        Devuelve los horarios con la marca disponible y el motivo cuando no cumple las
        48 horas (RN-03), el horizonte de 28 días (D06) o ya está reservado. La regla se
        evalúa en el servidor con su reloj; el navegador no decide. Hoy la oferta es
        sintética y la reemplazará I08 sin cambiar este contrato.
      security: [{ sesion: [] }]
      responses:
        '200':
          description: Lista de horarios con disponibilidad y motivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/SlotReserva' }
              examples:
                dosHorarios: { $ref: '#/components/examples/SlotsEjemplo' }
        '401':
          description: 401
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorNoAutenticado' }
  /api/reserva:
    post:
      tags: [D-reserva]
      summary: Crear una reserva confirmada (I04, transaccional desde I09)
      description: >
        Formulario con tema, objetivo y grado sobre un horario publicado. El escolar se
        toma de la sesión, nunca del cuerpo. Aplica RN-03 (48 h exactas), RN-07
        (longitudes), D06 (60 minutos y horizonte de 28 días) y D07 (dos reservas futuras y
        una sesión por curso y semana). La creación es transaccional y admite reintentos
        con Idempotency-Key. Los adjuntos se suben después, en cuarentena.
      security: [{ sesion: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Clave del intento (8 a 128 caracteres). Repetirla con los mismos datos devuelve
            la misma reserva con 200 en lugar de 201.
          schema: { type: string, minLength: 8, maxLength: 128 }
          example: reserva-2026-10-30-001
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaEntrada' }
            examples:
              algebra: { $ref: '#/components/examples/ReservaEntradaEjemplo' }
      responses:
        '201':
          description: Reserva confirmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaD' }
              examples:
                creada: { $ref: '#/components/examples/ReservaCreadaEjemplo' }
        '200':
          description: Reintento con la misma Idempotency-Key; devuelve la reserva ya creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaD' }
              examples:
                reintento: { $ref: '#/components/examples/ReservaCreadaEjemplo' }
        '400':
          description: 400
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorSolicitudInvalida' }
        '401':
          description: 401
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorNoAutenticado' }
        '403':
          description: 403
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorSinAutorizacion' }
        '404':
          description: 404
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorSlotInexistente' }
        '409':
          description: 409
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorSlotOcupado' }
        '422':
          description: 422
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorAnticipacion' }
  /api/reserva/{id}:
    get:
      tags: [D-reserva]
      summary: Consultar una reserva propia
      description: >
        Solo el escolar dueño de la reserva recibe los datos; cualquier otra cuenta recibe
        403. El tutor asignado consulta la reserva por la agenda (flujo E), no por aquí.
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, example: 6f1c2a9e-3b7d-4c1a-9f2e-8d4b5a6c7e8f }
      responses:
        '200':
          description: Reserva confirmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaD' }
              examples:
                reserva: { $ref: '#/components/examples/ReservaCreadaEjemplo' }
        '401':
          description: 401
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorNoAutenticado' }
        '403':
          description: 403
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorNoAutorizado' }
        '404':
          description: 404
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorReservaInexistente' }
  /api/reserva/{id}/adjuntos:
    get:
      tags: [D-reserva]
      summary: Listar los adjuntos de una reserva (I09)
      description: >
        Solo los participantes de la reserva (escolar dueño, tutor asignado) y coordinación
        ven los metadatos. El estado indica si el archivo está en cuarentena, validado o
        rechazado; la clave de almacenamiento nunca se expone.
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Adjuntos de la reserva
          content:
            application/json:
              schema:
                type: object
                properties:
                  adjuntos:
                    type: array
                    items: { $ref: '#/components/schemas/AdjuntoReserva' }
              examples:
                dosAdjuntos: { $ref: '#/components/examples/AdjuntosEjemplo' }
        '401':
          description: 401
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorNoAutenticado' }
        '403':
          description: 403
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorNoAutorizado' }
        '404':
          description: 404
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorReservaInexistente' }
    post:
      tags: [D-reserva]
      summary: Subir un adjunto a la reserva (I09)
      description: >
        Recibe multipart/form-data con el campo "archivo". Solo el escolar dueño puede
        subirlo. El tipo se detecta por contenido (PDF, PNG, JPG, TXT o DOCX de hasta 10 MB,
        máximo cinco por reserva) y el archivo queda en cuarentena hasta que el análisis lo
        valide. Si el análisis no está disponible, la reserva sigue confirmada.
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        description: >
          Formulario con un único campo de archivo. En Swagger UI elige un PDF, PNG, JPG,
          TXT o DOCX de hasta 10 MB; el nombre se conserva como referencia visible.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary, description: Archivo a adjuntar }
            encoding:
              archivo:
                contentType: application/pdf, image/png, image/jpeg, text/plain, application/vnd.openxmlformats-officedocument.wordprocessingml.document
      responses:
        '201':
          description: Adjunto recibido (puede quedar en cuarentena)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjuntoReserva' }
              examples:
                cuarentena: { $ref: '#/components/examples/AdjuntoCreadoEjemplo' }
        '400':
          description: 400
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorSolicitudInvalida' }
        '401':
          description: 401
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorNoAutenticado' }
        '403':
          description: 403
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorSoloEscolar' }
        '404':
          description: 404
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorReservaInexistente' }
        '409':
          description: 409
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorAdjuntosLlenos' }
        '413':
          description: 413
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorAdjuntoGrande' }
        '422':
          description: 422
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorAdjuntoInvalido' }
  /api/reserva/{id}/adjuntos/{adjuntoId}:
    get:
      tags: [D-reserva]
      summary: Descargar un adjunto validado (I09)
      description: >
        Enlace privado: exige sesión y participantes de la reserva, y solo entrega adjuntos
        validados. Los que siguen en cuarentena o fueron rechazados responden 409.
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: adjuntoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Contenido del archivo con su nombre original
          headers:
            Content-Disposition:
              description: Nombre del archivo como adjunto
              schema: { type: string, example: 'attachment; filename="guia-ejercicios.pdf"' }
            Content-Type:
              description: Tipo detectado en el servidor
              schema: { type: string, example: application/pdf }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          description: 401
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorNoAutenticado' }
        '403':
          description: 403
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorNoAutorizado' }
        '404':
          description: 404
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorAdjuntoInexistente' }
        '409':
          description: 409
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                caso: { $ref: '#/components/examples/ErrorAdjuntoCuarentena' }
  /api/sesion/salud:
    get: { tags: [E-sesion], summary: Esqueleto. Marco añade aquí su contrato., responses: { '200': { description: OK } } }
  /api/sesion/{id}:
    get:
      tags: [E-sesion]
      summary: Consultar una sesion
      description: >
        Permite consultar una sesion asociada a una reserva.
        Solo sus participantes autorizados pueden acceder.
        Durante I05 se utilizan reservas sinteticas.
      security: [{ sesion: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sesion encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionI05'
        '401': { description: Usuario no autenticado }
        '403': { description: Acceso no autorizado }
        '404': { description: Sesion inexistente }

  /api/sesion/{id}/asistencias:
    post:
      tags: [E-sesion]
      summary: Declarar asistencia propia
      description: >
        Registra la declaracion del participante autenticado.
        La identidad se obtiene de la autenticacion del servidor,
        nunca de un identificador enviado por el cliente.
        Declarar asistencia no acredita minutos verificados.
      security: [{ sesion: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Declaracion registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenciaI05'
        '401': { description: Usuario no autenticado }
        '403': { description: Acceso no autorizado }
        '404': { description: Sesion inexistente }
        '409': { description: Asistencia duplicada }
        '422': { description: Declaracion invalida }

  /api/salud:
    get: { tags: [A-acceso], summary: Estado del servicio de acceso, responses: { '200': { description: OK } } }
  /api/oferta/slots:
    get:
      tags: [C-oferta]
      security: [{ sesion: [] }]
      summary: Consultar la disponibilidad semanal del tutor autenticado
      responses:
        '200':
          description: Cupo y slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  cupo_semanal_minutos: { type: integer }
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        dia_semana: { type: integer, minimum: 0, maximum: 6 }
                        inicio: { type: string }
                        fin: { type: string }
                        zona_horaria: { type: string }
        '401': { description: Sin sesión }
        '403': { description: Solo tutores }
    post:
      tags: [C-oferta]
      security: [{ sesion: [] }]
      summary: Agregar slots a la disponibilidad semanal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [dia_semana, inicio, fin]
                    properties:
                      dia_semana: { type: integer, minimum: 0, maximum: 6 }
                      inicio: { type: string, example: "15:00" }
                      fin: { type: string, example: "16:00" }
      responses:
        '201':
          description: Slots creados
          content:
            application/json:
              schema:
                type: object
                properties:
                  cupo_semanal_minutos: { type: integer }
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        dia_semana: { type: integer }
                        inicio: { type: string }
                        fin: { type: string }
                        zona_horaria: { type: string }
        '400': { description: Cuerpo inválido }
        '401': { description: Sin sesión }
        '403': { description: Solo tutores }
        '409': { description: Solapamiento o cupo excedido }
        '422': { description: Validación }
  /api/oferta/slots/{id}:
    delete:
      tags: [C-oferta]
      security: [{ sesion: [] }]
      summary: Eliminar un slot de la disponibilidad semanal
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Eliminado }
        '401': { description: Sin sesión }
        '403': { description: Solo tutores }
        '404': { description: Slot no encontrado }
  /api/oferta/cupo:
    put:
      tags: [C-oferta]
      security: [{ sesion: [] }]
      summary: Cambiar el cupo semanal en minutos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutos]
              properties:
                minutos: { type: integer, minimum: 1 }
      responses:
        '200': { description: Cupo actualizado, content: { application/json: { schema: { type: object, properties: { cupo_semanal_minutos: { type: integer } } } } } }
        '400': { description: Cuerpo inválido }
        '401': { description: Sin sesión }
        '403': { description: Solo tutores }
        '422': { description: Cupo inválido }
  /api/agenda:
    get:
      tags: [E-sesion]
      security: [{ sesion: [] }]
      summary: Consultar la agenda del usuario autenticado
      description: Devuelve las reservas del escolar o del tutor autenticado.
      responses:
        '200':
          description: Reservas
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservas:
                    type: array
                    items: { $ref: '#/components/schemas/ReservaD' }
        '401': { description: Sin sesión }
        '403': { description: Rol sin acceso }
  /api/notificaciones:
    get:
      tags: [E-sesion]
      security: [{ sesion: [] }]
      summary: Consultar las notificaciones del usuario autenticado
      responses:
        '200':
          description: Notificaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificaciones:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        reserva_id: { type: string }
                        tipo: { type: string }
                        asunto: { type: string }
                        cuerpo: { type: string }
                        fecha: { type: string, format: date-time }
        '401': { description: Sin sesión }
        '403': { description: Rol sin acceso }
