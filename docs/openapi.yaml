openapi: 3.0.3
info:
  title: UniApp · Flujo A (Acceso) · I01
  version: 0.1.0
  description: Contrato de cuentas, sesión y roles. Los demás flujos lo consumen vía API (nunca por tablas).
servers: [{ url: http://localhost:8080 }]
tags:
  - { name: A-acceso, description: "Flujo A · Víctor · implementado en I01" }
  - { name: B-tutor, description: "Flujo B · expediente y revisión mínima (I02)" }
  - { name: C-oferta, description: "Flujo C · Mateo · esqueleto (I03)" }
  - { name: D-reserva, description: "Flujo D · Jhon · esqueleto (I04)" }
  - { name: E-sesion, description: "Flujo E · Marco · esqueleto (I05)" }
components:
  securitySchemes:
    sesion: { type: apiKey, in: cookie, name: uniapp_sesion }
  schemas:
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        nombre_uso: { type: string }
        rol: { type: string, enum: [escolar, apoderado, tutor, coordinador] }
        correo_confirmado: { type: boolean, description: "false hasta que se usa el enlace de confirmación" }
    Error:
      type: object
      properties:
        codigo: { type: string }
        mensaje: { type: string }
        campos: { type: object, additionalProperties: { type: string } }
    SlotReserva:
      type: object
      description: Horario publicado por el flujo C. En I04 proviene de una oferta sintética.
      properties:
        id: { type: string }
        tutor_id: { type: string }
        tutor_nombre: { type: string }
        curso: { type: string }
        inicio: { type: string, format: date-time, description: UTC }
        fin: { type: string, format: date-time, description: UTC }
        inicio_lima: { type: string, description: "America/Lima, por ejemplo 2026-10-22 15:00" }
        fin_lima: { type: string }
        disponible: { type: boolean, description: falso si no cumple 48 h, horizonte o cupo }
        motivo: { type: string, description: por qué no está disponible }
    AdjuntoReserva:
      type: object
      description: Metadatos del adjunto. El contenido vive en un almacén privado y no se expone.
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string }
        tamano_bytes: { type: integer, format: int64 }
        estado: { type: string, enum: [en_cuarentena, validado, rechazado] }
        motivo: { type: string, description: por qué está en cuarentena o fue rechazado }
        descargable: { type: boolean }
        creado_en: { type: string, description: "hora de Lima" }
    ReservaEntrada:
      type: object
      required: [slot_id, tema, objetivo, grado]
      properties:
        slot_id: { type: string }
        tema: { type: string, minLength: 10, maxLength: 200 }
        objetivo: { type: string, minLength: 20, maxLength: 1000 }
        grado: { type: string, maxLength: 80 }
    ReservaD:
      type: object
      description: Reserva confirmada de inmediato (D05, RN-06).
      properties:
        id: { type: string, format: uuid }
        slot_id: { type: string }
        tutor_id: { type: string }
        tutor_nombre: { type: string }
        curso: { type: string }
        grado: { type: string }
        tema: { type: string }
        objetivo: { type: string }
        estado: { type: string, enum: [confirmada] }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        inicio_lima: { type: string }
        fin_lima: { type: string }
        creada_en: { type: string, format: date-time }
        adjuntos:
          type: array
          items: { $ref: '#/components/schemas/AdjuntoReserva' }
    SesionI05:
      type: object
      required: [id, reserva_id, tutor_id, escolar_id, inicio, fin, asistencias]
      properties:
        id: { type: string }
        reserva_id: { type: string }
        tutor_id: { type: string }
        escolar_id: { type: string }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        asistencias:
          type: array
          items:
            $ref: '#/components/schemas/AsistenciaI05'
    AsistenciaI05:
      type: object
      required: [usuario_id, rol, declarada_en]
      properties:
        usuario_id: { type: string }
        rol: { type: string, enum: [tutor, escolar] }
        declarada_en: { type: string, format: date-time }
    DocumentoTutor:
      type: object
      required: [id, nombre, tipo, tamano_bytes]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string, enum: [application/pdf] }
        tamano_bytes: { type: integer, maximum: 10485760 }
        creado_en: { type: string, format: date-time }
    ExpedienteTutor:
      type: object
      required: [tutor_id, presentacion, cursos, experiencia, estado, presentado_en, documentos]
      properties:
        tutor_id: { type: string, format: uuid }
        presentacion: { type: string, maxLength: 500 }
        cursos: { type: string, maxLength: 500 }
        experiencia: { type: string, maxLength: 2000 }
        estado: { type: string, enum: [pendiente, aprobado, rechazado] }
        presentado_en: { type: string, format: date-time }
        vence_en: { type: string, format: date-time }
        motivo_rechazo: { type: string }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/DocumentoTutor' }
paths:
  /api/auth/registro:
    post:
      summary: Registro público (escolar, apoderado, tutor). Coordinación no se autoasigna.
      description: La cuenta nace sin confirmar y se envía un enlace de un solo uso (30 min) al correo. Si no se confirma en ese plazo, la cuenta se borra y el correo queda libre. Un correo admite un solo registro.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, nombre_uso, clave, rol], properties: { email: {type: string}, nombre_uso: {type: string}, clave: {type: string}, rol: {type: string, enum: [escolar, apoderado, tutor]} } } } }
      responses:
        '201': { description: Creado sin confirmar; se envió un enlace al correo, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '403': { description: Rol no permitido }
        '409': { description: Correo en uso (un correo, un registro) }
        '422': { description: Validación por campo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/ingreso:
    post:
      summary: Abre sesión (cookie HttpOnly, SameSite=Strict, 12 h)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '401': { description: Credenciales incorrectas (mensaje genérico; también cubre cuentas sin confirmar) }
        '429': { description: 5 fallos seguidos; bloqueo de 15 min }
  /api/auth/salida:
    post: { security: [{ sesion: [] }], summary: Cierra sesión, responses: { '204': { description: OK }, '401': { description: Sin sesión } } }
  /api/auth/yo:
    get: { security: [{ sesion: [] }], summary: Usuario de la sesión, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }, '401': { description: Sin sesión } } }
  /api/auth/recuperar:
    post: { summary: Solicita enlace (respuesta idéntica exista o no el correo), responses: { '202': { description: Aceptado } } }
  /api/auth/restablecer:
    post:
      summary: Cambia la clave con token de un solo uso (vence en 1 h) y cierra todas las sesiones
      responses: { '200': { description: OK }, '400': { description: Token inválido o vencido }, '422': { description: Clave no cumple la política del rol } }
  /api/auth/confirmar:
    post:
      summary: Confirma el correo con el token del enlace (un solo uso, vence en 30 min)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses: { '200': { description: Correo confirmado }, '400': { description: Token inválido, vencido o ya usado } }
  /api/auth/reenviar-confirmacion:
    post:
      summary: Reenvía el enlace (renueva 30 min; respuesta idéntica exista o no el correo, para no revelar registros)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses: { '202': { description: Aceptado } }
  /api/coordinacion/panel:
    get:
      security: [{ sesion: [] }]
      summary: Zona de coordinación (permiso coordinacion:acceder)
      responses: { '200': { description: OK }, '401': { description: Sin sesión }, '403': { description: Rol sin permiso (p. ej. escolar) } }
  /api/tutor/salud:
    get: { tags: [B-tutor], summary: Estado del flujo B, responses: { '200': { description: OK } } }
  /api/tutor/mi-expediente:
    get:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Consultar el expediente propio (solo tutor)
      responses:
        '200': { description: Expediente propio, content: { application/json: { schema: { $ref: '#/components/schemas/ExpedienteTutor' } } } }
        '401': { description: Sin sesión }
        '403': { description: La cuenta no puede presentar expedientes }
        '404': { description: Aún no existe un expediente }
  /api/tutor/expediente:
    post:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Presentar o volver a presentar un expediente de tutor
      description: El perfil permanece privado hasta ser aprobado. Acepta de 1 a 5 PDF, máximo 10 MiB por archivo. Los archivos se guardan fuera del contenido público y se descargan con autorización.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [presentacion, cursos, experiencia, documentos]
              properties:
                presentacion: { type: string, maxLength: 500 }
                cursos: { type: string, maxLength: 500 }
                experiencia: { type: string, maxLength: 2000 }
                documentos:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        '201': { description: Expediente enviado a revisión, content: { application/json: { schema: { $ref: '#/components/schemas/ExpedienteTutor' } } } }
        '401': { description: Sin sesión }
        '403': { description: La cuenta no puede presentar expedientes }
        '422': { description: Campos inválidos o PDF no válido }
  /api/tutor/revision:
    get:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Listar expedientes pendientes (solo coordinación)
      responses:
        '200': { description: Expedientes pendientes }
        '401': { description: Sin sesión }
        '403': { description: Sin permiso de coordinación }
  /api/tutor/{id}/revision:
    post:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Aprobar o rechazar un expediente pendiente (solo coordinación)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [estado, vence_en]
                  properties:
                    estado: { type: string, enum: [aprobado] }
                    vence_en: { type: string, format: date-time }
                - type: object
                  required: [estado, motivo_rechazo]
                  properties:
                    estado: { type: string, enum: [rechazado] }
                    motivo_rechazo: { type: string }
      responses:
        '200': { description: Revisión guardada }
        '401': { description: Sin sesión }
        '403': { description: Sin permiso de coordinación }
        '404': { description: Expediente inexistente }
        '409': { description: Expediente ya revisado }
        '422': { description: Fecha o motivo inválidos }
  /api/tutor/documentos/{id}:
    get:
      tags: [B-tutor]
      security: [{ sesion: [] }]
      summary: Descargar un documento privado (propietario o coordinación)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: PDF privado, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '401': { description: Sin sesión }
        '403': { description: Sin permiso }
        '404': { description: Documento inexistente }
  /api/tutor/perfiles/{id}:
    get:
      tags: [B-tutor]
      summary: Consultar perfil aprobado y vigente (no incluye documentos)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Perfil público
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteTutor' }
        '404': { description: Perfil no aprobado, vencido o inexistente }
  /api/oferta/salud:
    get: { tags: [C-oferta], summary: Esqueleto. Mateo añade aquí su contrato., responses: { '200': { description: OK } } }
  /api/reserva/salud:
    get: { tags: [D-reserva], summary: Estado del flujo D, responses: { '200': { description: OK } } }
  /api/reserva/slots:
    get:
      tags: [D-reserva]
      summary: Oferta disponible para reservar (I04, sintética)
      description: >
        Devuelve los horarios con la marca disponible y el motivo del rechazo cuando no
        cumple las 48 horas (RN-03), el horizonte de 28 días (D06) o ya está reservado.
        La regla se evalúa en el modelo con la hora del servidor.
      security: [{ sesion: [] }]
      responses:
        '200':
          description: Lista de horarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/SlotReserva' }
        '401': { description: Sin sesión }
  /api/reserva:
    post:
      tags: [D-reserva]
      summary: Crear una reserva confirmada (I04, transaccional desde I09)
      description: >
        Formulario con tema, objetivo y grado sobre un horario publicado. El escolar se
        toma de la sesión, nunca del cuerpo. Aplica RN-03 (48 h exactas), RN-07
        (longitudes), D06 (60 minutos y horizonte de 28 días) y D07 (dos reservas futuras y
        una sesión por curso y semana). La creación es transaccional y admite reintentos
        con Idempotency-Key. Los adjuntos se suben después, en cuarentena.
      security: [{ sesion: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Clave del intento (8 a 128 caracteres). Repetirla con los mismos datos devuelve
            la misma reserva con 200 en lugar de 201.
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaEntrada' }
      responses:
        '201':
          description: Reserva confirmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaD' }
        '200':
          description: Reintento con la misma Idempotency-Key; devuelve la reserva ya creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaD' }
        '400': { description: Cuerpo inválido }
        '401': { description: Sin sesión }
        '403': { description: La cuenta no es de escolar }
        '404': { description: El horario no existe }
        '409': { description: "Conflictos (códigos: slot_ocupado, slot_vencido, solapamiento, cuota_escolar, cuota_curso_semana, idempotencia_conflicto)" }
        '422': { description: "Validación (códigos: validacion, anticipacion_insuficiente, horizonte_excedido)" }
  /api/reserva/{id}:
    get:
      tags: [D-reserva]
      summary: Consultar una reserva propia
      description: Solo el escolar dueño de la reserva recibe los datos; cualquier otra cuenta recibe 403.
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaD' }
        '401': { description: Sin sesión }
        '403': { description: La reserva es de otra persona }
        '404': { description: La reserva no existe }
  /api/reserva/{id}/adjuntos:
    get:
      tags: [D-reserva]
      summary: Listar los adjuntos de una reserva (I09)
      description: >
        Solo los participantes de la reserva (escolar dueño, tutor asignado) y coordinación
        ven los metadatos. El estado indica si el archivo está en cuarentena, validado o
        rechazado; la clave de almacenamiento nunca se expone.
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Adjuntos
          content:
            application/json:
              schema:
                type: object
                properties:
                  adjuntos:
                    type: array
                    items: { $ref: '#/components/schemas/AdjuntoReserva' }
        '401': { description: Sin sesión }
        '403': { description: La reserva es de otra persona }
        '404': { description: La reserva no existe }
    post:
      tags: [D-reserva]
      summary: Subir un adjunto a la reserva (I09)
      description: >
        Recibe multipart/form-data con el campo "archivo". Solo el escolar dueño puede
        subirlo. El tipo se detecta por contenido (PDF, PNG, JPG, TXT o DOCX de hasta 10 MB,
        máximo cinco por reserva) y el archivo queda en cuarentena hasta que el análisis lo
        valide. Si el análisis no está disponible, la reserva sigue confirmada.
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        '201':
          description: Adjunto recibido (puede quedar en cuarentena)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjuntoReserva' }
        '400': { description: Falta el archivo o el formulario no es multipart }
        '401': { description: Sin sesión }
        '403': { description: La reserva no es del escolar autenticado }
        '404': { description: La reserva no existe }
        '409': { description: "Límite alcanzado (código: adjuntos_llenos)" }
        '413': { description: El archivo supera los 10 MB }
        '422': { description: "Tipo no permitido (código: adjunto_invalido)" }
  /api/reserva/{id}/adjuntos/{adjuntoId}:
    get:
      tags: [D-reserva]
      summary: Descargar un adjunto validado (I09)
      description: >
        Enlace privado: exige sesión y participantes de la reserva, y solo entrega adjuntos
        validados. Los que siguen en cuarentena o fueron rechazados responden 409.
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: adjuntoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Contenido del archivo
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Sin sesión }
        '403': { description: La reserva es de otra persona }
        '404': { description: La reserva o el adjunto no existen }
        '409': { description: "Adjunto en cuarentena o rechazado" }
  /api/sesion/salud:
    get: { tags: [E-sesion], summary: Esqueleto. Marco añade aquí su contrato., responses: { '200': { description: OK } } }
  /api/sesion/{id}:
    get:
      tags: [E-sesion]
      summary: Consultar una sesion
      description: >
        Permite consultar una sesion asociada a una reserva.
        Solo sus participantes autorizados pueden acceder.
        Durante I05 se utilizan reservas sinteticas.
      security: [{ sesion: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sesion encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionI05'
        '401': { description: Usuario no autenticado }
        '403': { description: Acceso no autorizado }
        '404': { description: Sesion inexistente }

  /api/sesion/{id}/asistencias:
    post:
      tags: [E-sesion]
      summary: Declarar asistencia propia
      description: >
        Registra la declaracion del participante autenticado.
        La identidad se obtiene de la autenticacion del servidor,
        nunca de un identificador enviado por el cliente.
        Declarar asistencia no acredita minutos verificados.
      security: [{ sesion: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Declaracion registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenciaI05'
        '401': { description: Usuario no autenticado }
        '403': { description: Acceso no autorizado }
        '404': { description: Sesion inexistente }
        '409': { description: Asistencia duplicada }
        '422': { description: Declaracion invalida }
